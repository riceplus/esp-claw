version: 1.0.0
# Devices for generic ESP32-S3 N16R8 dev board
devices:

  # 3.5 inch ST7796 SPI LCD (320x480)
  - name: display_lcd
    chip: st7796
    type: display_lcd
    sub_type: spi
    version: default
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: false
      invert_color: true
      x_max: 320
      y_max: 480
      io_spi_config:
        cs_gpio_num: 10
        dc_gpio_num: 8
        spi_mode: 0
        pclk_hz: 60000000
        cs_ena_pretrans: 1
        cs_ena_posttrans: 1
      lcd_panel_config:
        reset_gpio_num: 9
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        vendor_config: NULL
    peripherals:
      - name: spi_bus

  # LCD backlight (LEDC-controlled)
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 100
    peripherals:
      - name: ledc_backlight

  # FT6336U capacitive touch (I2C, FT5x06 compatible)
  - name: lcd_touch
    chip: ft5x06
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_ft5x06: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 100000
        flags:
          disable_control_phase: true
      touch_config:
        x_max: 320
        y_max: 480
        rst_gpio_num: 2
        int_gpio_num: 3
    peripherals:
      - name: i2c_master
        i2c_addr: [0x70]

  # MAX98357 I2S class-D audio amplifier
  - name: audio_dac
    chip: internal
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      dac_init_gain: 0
      mclk_enabled: false
    peripherals:
      - name: i2s_audio_out

  # MAX98357 shutdown pin enable
  - name: amp_enable
    type: gpio_ctrl
    version: default
    config:
      active_level: 1
      default_level: 1
    peripherals:
      - name: gpio_amp_sd

  # MicroSD card slot (SPI mode, shared bus with display)
  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 6
        frequency: SDMMC_FREQ_DEFAULT
    peripherals:
      - name: spi_bus
